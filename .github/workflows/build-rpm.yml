name: build-rpm

# Build the patched libfprint RPM for currently supported Fedora releases.
# Currently builds for Fedora 44 and rawhide.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild weekly so that a Fedora point release that breaks the build is
    # noticed, and so freshly released Fedora versions get picked up quickly.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: libfprint RPM (Fedora ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['44', 'rawhide']
    outputs:
      fedora-version: ${{ steps.detect.outputs.version }}
      rpm-path: ${{ steps.build.outputs.rpm-path }}
    container:
      image: fedora:${{ matrix.version }}
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            dnf-plugins-core \
            gcc \
            gcc-c++ \
            git \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            rpm-build \
            rpmrebuild \
            glib2-devel \
            gobject-introspection-devel \
            libgudev-devel \
            gnutls-devel \
            openssl-devel \
            libtool \
            python3 \
            systemd-devel \
            cpio \
            findutils

      - name: Detect Fedora version
        id: detect
        run: |
          set -euo pipefail
          if [[ "${{ matrix.version }}" == "rawhide" ]]; then
            # For rawhide, get the actual development version
            FEDORA_VER=$(dnf -q repoquery --qf '%{version}' --whatprovides fedora-release | head -1 | cut -d. -f1)
          else
            FEDORA_VER="${{ matrix.version }}"
          fi
          echo "version=$FEDORA_VER" >> "$GITHUB_OUTPUT"
          echo "Detected Fedora version: $FEDORA_VER"

      - name: Fetch existing libfprint NEVRA for this Fedora
        id: nevra
        run: |
          set -euo pipefail
          v="$(dnf -q repoquery --qf '%{version}-%{release}' --whatprovides libfprint | head -1)"
          echo "libfprint=$v" >> "$GITHUB_OUTPUT"

      - name: Build RPM
        id: build
        env:
          OUT: ${{ github.workspace }}/out
        run: |
          ./scripts/build-rpm.sh
          # Find and output the built RPM path
          rpm_path=$(find "$OUT/dist" -name "libfprint-*.x86_64.rpm" -print -quit)
          echo "rpm-path=$rpm_path" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp out/dist/*.rpm dist/ 2>/dev/null || cp "$GITHUB_WORKSPACE"/dist/*.rpm dist/ || true
          ls -lh dist

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: libfprint-tudormoc-fc${{ steps.detect.outputs.version }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.rpm" | sort

      - name: Attach RPMs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.rpm
          fail_on_unmatched_files: true